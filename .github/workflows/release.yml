name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# action-gh-release 用 GITHUB_TOKEN 调 GitHub Release API；2023 起默认 token
# 只读，必须显式声明 contents:write 才能 publish release。
permissions:
  contents: write

env:
  BOOST_LIBS: regex,system,filesystem,thread
  BOOST_PLATFORMS: ios,iossim-both

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          cmake --version
          clang --version

      # Compute cache key: actions/cache rejects commas. Replace them with dashes
      # so BOOST_LIBS=regex,system,... becomes a valid key fragment.
      - name: Compute cache key
        id: cache-key
        run: |
          libs_safe=$(echo "$BOOST_LIBS"       | tr ',' '-')
          plats_safe=$(echo "$BOOST_PLATFORMS" | tr ',' '-')
          echo "key=boost-iosx-${{ runner.os }}-${{ hashFiles('deps/boost-iosx/scripts/build.sh', 'deps/boost-iosx/LOCATIONS', '.gitmodules') }}-${libs_safe}-${plats_safe}" >> "$GITHUB_OUTPUT"

      # boost-iosx ICU + boost stage 是最大耗时 (~25 min cold).
      # build.sh 自己检查 frameworks.built.platforms / .libs, 若 cache 命中且参数一致就 exit 0.
      # 我们 cache 整个 boost-iosx 工作目录 (Pods/icu4c-iosx + stage/ + frameworks/ + 源码 tarball).
      - name: Restore boost-iosx cache
        id: boost-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/boost-iosx/frameworks
            deps/boost-iosx/scripts/Pods
            deps/boost-iosx/boost
            deps/boost-iosx/boost_*.tar.bz2
            deps/boost-iosx/frameworks.built.libs
            deps/boost-iosx/frameworks.built.platforms
          key: ${{ steps.cache-key.outputs.key }}

      - name: Build boost (skipped on cache hit, see frameworks.built.*)
        run: make boost BOOST_LIBS="$BOOST_LIBS" BOOST_PLATFORMS="$BOOST_PLATFORMS"

      - name: Build small deps (glog/leveldb/yaml-cpp/marisa/opencc)
        run: make deps

      - name: Build librime
        run: make librime

      - name: Pack xcframeworks
        run: make pack

      - name: Verify output
        run: |
          ls -lh Frameworks/
          for fw in Frameworks/*.xcframework; do
            name=$(basename "$fw")
            slices=$(ls "$fw" | grep -v Info.plist | tr '\n' ' ')
            echo "  $name → $slices"
          done

      - name: Create release tarball
        run: |
          cd Frameworks
          tar -czf ../Frameworks.tgz *.xcframework
          cd -
          ls -lh Frameworks.tgz

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frameworks
          path: Frameworks.tgz
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Frameworks.tgz
          generate_release_notes: true
          draft: false
          prerelease: false
